# ==========================================
# CLINIC DASHBOARD - DARK THEME
# ==========================================

# Global Styling & Arc Rounding
Component.arc = 10
Button.arc = 12
TextComponent.arc = 8
Component.focusWidth = 1

# Color Palette Variables (Deep Slate / Navy)
@bg = #0F172A
@surface = #1E293B
@panelBg = #1E293B
@headerBg = #0369A1
@headerFg = #FFFFFF
@primary = #38BDF8
@text = #F8FAFC
@subtext = #94A3B8
@border = #334155
@hover = #334155

# Window & Base Application
@background = #1E1E1E
Panel.background = #2B2D30
Label.foreground = @text

# Input Fields (JTextField, JTextArea)
TextComponent.background = @surface
TextComponent.foreground = @text
TextComponent.placeholderForeground = @subtext
TextComponent.borderColor = @border
TextComponent.focusedBorderColor = @primary

# Buttons
Button.background = @surface
Button.foreground = @text
Button.borderColor = @border
Button.hoverBackground = @hover
Button.default.background = @primary
Button.default.foreground = #0F172A

# Tables (Check-in Logs)
Table.background = #2B2D30
Table.foreground = #FFFFFF
Table.gridColor = #3C3F41
Table.selectionBackground = #0369A1
Table.selectionForeground = #FFFFFF
Table.rowHeight = 32
TableHeader.background = #212325
TableHeader.foreground = #E0E0E0
TableHeader.separatorColor = @border

TextArea.background = #2B2D30
TextArea.foreground = #FFFFFF

# ComboBox & Dropdowns
ComboBox.background = @surface
ComboBox.foreground = @text
ComboBox.buttonBackground = @surface
ComboBox.selectionBackground = #0369A1
ComboBox.selectionForeground = #FFFFFF

# Scrollbars
ScrollBar.thumbArc = 999
ScrollBar.thumbColor = #475569

# Custom Header Panel Key
Clinic.headerBackground = @headerBg
Clinic.headerForeground = @headerFg