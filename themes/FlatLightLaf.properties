# ==========================================
# CLINIC DASHBOARD - LIGHT THEME
# ==========================================

# Global Styling & Arc Rounding
Component.arc = 10
Button.arc = 12
TextComponent.arc = 8
Component.focusWidth = 1

# Color Palette Variables
@bg = #F8FAFC
@surface = #FFFFFF
@panelBg = #FFFFFF
@headerBg = #0284C7
@headerFg = #FFFFFF
@primary = #0284C7
@text = #0F172A
@subtext = #64748B
@border = #E2E8F0
@hover = #E0F2FE

# Window & Base Application
@background = #F4F6F8
Panel.background = #FFFFFF
Label.foreground = @text

# Input Fields (JTextField, JTextArea)
TextComponent.background = @surface
TextComponent.foreground = @text
TextComponent.placeholderForeground = @subtext
TextComponent.borderColor = @border
TextComponent.focusedBorderColor = @primary

# Buttons
Button.background = @surface
Button.foreground = @text
Button.borderColor = @border
Button.hoverBackground = @hover
Button.default.background = @primary
Button.default.foreground = #FFFFFF

# Tables (Check-in Logs)
Table.background = #FFFFFF
Table.foreground = #000000
Table.gridColor = @border
Table.selectionBackground = #E0F2FE
Table.selectionForeground = #0369A1
Table.rowHeight = 32
TableHeader.background = #EFEFEF
TableHeader.foreground = #000000
TableHeader.separatorColor = @border

TextArea.background = #FFFFFF
TextArea.foreground = #000000

# ComboBox & Dropdowns
ComboBox.background = @surface
ComboBox.foreground = @text
ComboBox.buttonBackground = @surface
ComboBox.selectionBackground = #E0F2FE
ComboBox.selectionForeground = #0369A1

# Scrollbars
ScrollBar.thumbArc = 999
ScrollBar.thumbColor = #CBD5E1

# Custom Header Panel Key
Clinic.headerBackground = @headerBg
Clinic.headerForeground = @headerFg